spring.application.name=portfolio

# ---------- Server ----------
# Uses $PORT when the host injects it (Railway/Render/Heroku), else 8080.
server.port=${PORT:8080}

# ---------- H2 Database (file based so data persists across restarts) ----------
spring.datasource.url=jdbc:h2:file:./data/portfolio-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- H2 web console at /h2-console (login: sa / empty) ----------
# Disabled for production. Set to true locally if you need the browser console.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false

# ---------- File uploads (resume / profile photo / certificate PDFs) ----------
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
portfolio.upload-dir=./uploads

# ---------- Admin login (override with environment variables in production!) ----------
portfolio.admin.username=${PORTFOLIO_ADMIN_USERNAME:admin}
portfolio.admin.password=${PORTFOLIO_ADMIN_PASSWORD:changeme}

# ---------- Error handling (do not leak internals in production) ----------
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.whitelabel.enabled=false
