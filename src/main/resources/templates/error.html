<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<meta name="color-scheme" content="light"/>
<title th:text="${status} + ' — ' + (${error} ?: 'Error')">Error</title>
<link rel="icon" type="image/svg+xml" href="/images/logo.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: 'Geist', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: radial-gradient(900px 500px at 70% -10%, rgba(6,182,212,.14), transparent 60%),
                radial-gradient(700px 500px at 10% 10%, rgba(79,70,229,.14), transparent 60%), #f7f8fc;
    color: #10131a;
  }
  .card {
    position: relative; width: 100%; max-width: 520px; text-align: center;
    background: #fff; border: 1px solid #e2e6f2; border-radius: 24px; padding: 52px 40px;
    box-shadow: 0 30px 80px -40px rgba(30,40,90,.35);
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px; font-size: .78rem; font-weight: 700;
    letter-spacing: .16em; text-transform: uppercase; color: #4f46e5;
    border: 1px solid #e2e6f2; border-radius: 999px; padding: 6px 14px;
  }
  h1 { font-size: clamp(64px, 16vw, 120px); line-height: 1; margin: 18px 0 4px; letter-spacing: -.04em;
       background: linear-gradient(100deg, #4f46e5, #06b6d4); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p { color: #5b6478; margin: 0 0 26px; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 600; border-radius: 999px; padding: 12px 26px;
    background: #4f46e5; color: #fff; transition: transform .2s ease, background .2s ease;
  }
  .btn:hover { background: #06b6d4; transform: translateY(-2px); }
  .path { font-family: ui-monospace, monospace; font-size: .82rem; color: #8a93a8; margin-top: 22px; word-break: break-all; }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">Adarsh Khare</span>
    <h1 th:text="${status} ?: '404'">404</h1>
    <p th:text="${error} ?: 'Page not found'">Page not found</p>
    <a class="btn" href="/">Back to home</a>
    <div class="path" th:if="${path != null}" th:text="${path}">/</div>
  </main>
</body>
</html>
