<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments :: head('Experience')}"></head>
<body class="admin">
<div class="admin-layout">
    <aside th:replace="~{admin/fragments :: sidebar('experiences')}"></aside>
    <main class="admin-main">
        <div class="admin-header">
            <h1 th:text="${experience.id == null ? 'New experience' : 'Edit experience'}">Experience</h1>
        </div>
        <div class="panel">
            <form th:action="@{/admin/experiences/save}" th:object="${experience}" method="post" class="form-grid">
                <input type="hidden" th:field="*{id}"/>
                <label>Role
                    <input type="text" th:field="*{role}" required/>
                </label>
                <label>Company
                    <input type="text" th:field="*{company}" required/>
                </label>
                <label>Location
                    <input type="text" th:field="*{location}"/>
                </label>
                <label>Start date
                    <input type="date" th:field="*{startDate}"/>
                </label>
                <label>End date
                    <input type="date" th:field="*{endDate}"/>
                </label>
                <label class="checkbox">
                    <input type="checkbox" th:field="*{current}"/> I currently work here
                </label>
                <label class="full">Description
                    <textarea th:field="*{description}" rows="5"></textarea>
                </label>
                <div class="full form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="/admin/experiences" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
