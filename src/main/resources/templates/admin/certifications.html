<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments :: head('Certifications')}"></head>
<body class="admin">
<div class="admin-layout">
    <aside th:replace="~{admin/fragments :: sidebar('certifications')}"></aside>
    <main class="admin-main">
        <div class="admin-header row">
            <div>
                <h1>Certifications</h1>
                <p class="muted">Certifications and credentials you hold.</p>
            </div>
            <a href="/admin/certifications/new" class="btn btn-primary btn-sm">+ New certification</a>
        </div>

        <div th:replace="~{admin/fragments :: flash}"></div>

        <div class="panel no-pad">
            <table class="table">
                <thead>
                <tr><th>Title</th><th>Issuer</th><th>Year</th><th class="right">Actions</th></tr>
                </thead>
                <tbody>
                <tr th:each="cert : ${certifications}">
                    <td>
                        <span th:text="${cert.title}">Title</span>
                        <span th:if="${cert.credentialFile != null and !cert.credentialFile.isEmpty()}" class="badge-pdf">PDF</span>
                    </td>
                    <td th:text="${cert.issuer}">Issuer</td>
                    <td th:text="${cert.year}">2026</td>
                    <td class="right actions">
                        <a th:href="@{/admin/certifications/edit/{id}(id=${cert.id})}" class="btn btn-outline btn-xs">Edit</a>
                        <form th:action="@{/admin/certifications/delete/{id}(id=${cert.id})}" method="post" class="inline-form">
                            <button type="submit" class="btn btn-danger btn-xs" data-confirm="Delete this certification?">Delete</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${certifications.isEmpty()}"><td colspan="4" class="empty">No certifications yet.</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
</body>
</html>
