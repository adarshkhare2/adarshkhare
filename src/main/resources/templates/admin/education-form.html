<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{admin/fragments :: head('Education')}"></head>
<body class="admin">
<div class="admin-layout">
    <aside th:replace="~{admin/fragments :: sidebar('educations')}"></aside>
    <main class="admin-main">
        <div class="admin-header">
            <h1 th:text="${education.id == null ? 'New education' : 'Edit education'}">Education</h1>
        </div>
        <div class="panel">
            <form th:action="@{/admin/educations/save}" th:object="${education}" method="post" class="form-grid">
                <input type="hidden" th:field="*{id}"/>
                <label>Degree
                    <input type="text" th:field="*{degree}" required/>
                </label>
                <label>Institution
                    <input type="text" th:field="*{institution}" required/>
                </label>
                <label>Location
                    <input type="text" th:field="*{location}"/>
                </label>
                <label>Start year
                    <input type="text" th:field="*{startYear}" placeholder="2019"/>
                </label>
                <label>End year
                    <input type="text" th:field="*{endYear}" placeholder="2023"/>
                </label>
                <label class="full">Description
                    <textarea th:field="*{description}" rows="4"></textarea>
                </label>
                <div class="full form-actions">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <a href="/admin/educations" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
