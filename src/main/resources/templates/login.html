<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/admin.css(v=7)}"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body class="login-page">
<div class="login-card">
    <h1>Admin Login</h1>
    <p class="muted">Sign in to manage your portfolio.</p>
    <div th:if="${param.error}" class="alert alert-error">Invalid username or password.</div>
    <div th:if="${param.logout}" class="alert alert-ok">You have been logged out.</div>
    <form th:action="@{/login}" method="post">
        <label>Username
            <input type="text" name="username" required autofocus/>
        </label>
        <label>Password
            <input type="password" name="password" required/>
        </label>
        <button type="submit" class="btn btn-primary block">Sign in</button>
    </form>
    <a href="/" class="back-link">&larr; Back to portfolio</a>
</div>
</body>
</html>
